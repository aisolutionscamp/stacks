# Values for the local chart in ./chart (see install.sh).
# All keys and their defaults: chart/values.yaml

image:
  repository: ghcr.io/huggingface/text-embeddings-inference
  tag: cpu-1.9.4

model:
  id: BAAI/bge-base-en-v1.5
  revision: main

extraEnv:
  MAX_CLIENT_BATCH_SIZE: "32"
  AUTO_TRUNCATE: "true"

# Created by install.sh. Requests then need "Authorization: Bearer <key>".
apiKey:
  existingSecret: tei-api-key
  secretKey: api-key

persistence:
  enabled: true
  size: 10Gi
  accessModes:
    - ReadWriteOnce

service:
  type: ClusterIP
  port: 80

# bge-base-en-v1.5 used about 1.3 GiB of memory on CPU in our test.
resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    memory: 4Gi

# Stays off with a ReadWriteOnce cache volume (the chart refuses the
# combination). Use a ReadWriteMany storage class or persistence.enabled=false
# to scale out.
autoscaling:
  enabled: false

ingress:
  enabled: false

name: rag-api image

# Builds ghcr.io/aisolutionscamp/rag-api from stacks/rag-pipeline/app and
# pushes it with the version from app/VERSION and sha-<short commit>.
# Bump app/VERSION for a release. An existing version tag is never
# overwritten: then only sha-<short> is pushed. Pull requests only build.

on:
  push:
    branches: [main]
    paths:
      - "stacks/rag-pipeline/app/**"
      - ".github/workflows/rag-api-image.yml"
  pull_request:
    paths:
      - "stacks/rag-pipeline/app/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rag-api-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/aisolutionscamp/rag-api
  CONTEXT: stacks/rag-pipeline/app

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Read version
        id: version
        run: |
          version=$(tr -d '[:space:]' < "$CONTEXT/VERSION")
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad VERSION: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4.4.0

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing version tag
        if: github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "::warning::$IMAGE:$VERSION already exists; pushing only sha-${GITHUB_SHA::7}. Bump $CONTEXT/VERSION for a release."
            echo "TAGS=$IMAGE:sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          else
            echo "TAGS=$IMAGE:$VERSION,$IMAGE:sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Build (push only on main)
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.TAGS || format('{0}:pr', env.IMAGE) }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=rag-api for the AI Solutions Camp RAG Pipeline stack
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true
